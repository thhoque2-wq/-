          cat > ScreenRecorderPro/app/src/main/java/com/hiddeninfo/screenrecorder/ScreenRecorder.kt <<'KTEOF'
          package com.hiddeninfo.screenrecorder

          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.os.Bundle
          import android.os.SystemClock
          import android.view.Surface
          import java.io.FileDescriptor
          import java.nio.ByteOrder

          data class RecConfig(
              val width: Int,
              val height: Int,
              val dpi: Int,
              val fps: Int,
              val bitrate: Int,
              val mic: Boolean,
              val internal: Boolean
          )

          /**
           * Screen + audio recorder.
           * Video: MediaProjection -> VirtualDisplay -> H.264 (MediaCodec surface input)
           * Audio: mic and/or internal (AudioPlaybackCapture) -> mixed -> AAC
           * Output: MP4 via MediaMuxer. Supports pause / resume.
           */
          class ScreenRecorder(
              private val projection: MediaProjection,
              private val cfg: RecConfig,
              private val fd: FileDescriptor
          ) {
              companion object {
                  const val SR = 44100
              }

              var micActive = false
                  private set
              var internalActive = false
                  private set

              private var vEnc: MediaCodec? = null
              private var aEnc: MediaCodec? = null
              private var muxer: MediaMuxer? = null
              private var vDisplay: VirtualDisplay? = null
              private var micRec: AudioRecord? = null
              private var capRec: AudioRecord? = null
              private var surface: Surface? = null
              private var vThread: Thread? = null
              private var aThread: Thread? = null

              private val muxLock = Any()
              @Volatile private var muxerStarted = false
              private var tracksExpected = 1
              private var tracksAdded = 0
              private var vTrack = -1
              private var aTrack = -1

              @Volatile private var stopping = false
              @Volatile private var paused = false
              @Volatile private var failed = false
              @Volatile private var wroteVideo = false
              @Volatile private var stopReqMs = 0L
              private var startUs = 0L
              @Volatile private var pausedTotalUs = 0L
              private var pauseStartUs = 0L

              private fun nowUs(): Long = System.nanoTime() / 1000L

              // ---------------------------------------------------------------- start
              fun start() {
                  try {
                      val vf = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, cfg.width, cfg.height)
                      vf.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                      vf.setInteger(MediaFormat.KEY_BIT_RATE, cfg.bitrate)
                      vf.setInteger(MediaFormat.KEY_FRAME_RATE, cfg.fps)
                      vf.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      val venc = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                      vEnc = venc
                      venc.configure(vf, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      val surf = venc.createInputSurface()
                      surface = surf

                      if (cfg.mic) {
                          try {
                              micRec = buildMic()
                              micActive = true
                          } catch (e: Exception) {
                              micRec = null
                          }
                      }
                      if (cfg.internal) {
                          try {
                              capRec = buildCapture()
                              internalActive = true
                          } catch (e: Exception) {
                              capRec = null
                          }
                      }
                      if (micRec != null || capRec != null) {
                          val af = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, SR, 2)
                          af.setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                          af.setInteger(MediaFormat.KEY_BIT_RATE, 128000)
                          af.setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                          val aenc = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                          aEnc = aenc
                          aenc.configure(af, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                          tracksExpected = 2
                      }

                      muxer = MediaMuxer(fd, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                      startUs = nowUs()
                      venc.start()
                      aEnc?.start()
                      vDisplay = projection.createVirtualDisplay(
                          "ScreenRecorderPro", cfg.width, cfg.height, cfg.dpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, surf, null, null
                      )
                      micRec?.startRecording()
                      capRec?.startRecording()

                      val vt = Thread({ videoLoop() }, "rec-video")
                      vThread = vt
                      vt.start()
                      if (aEnc != null) {
                          val at = Thread({ audioLoop() }, "rec-audio")
                          aThread = at
                          at.start()
                      }
                  } catch (e: Exception) {
                      releaseAll()
                      throw e
                  }
              }

              private fun buildMic(): AudioRecord {
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SR)
                      .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                      .build()
                  val min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val rec = AudioRecord.Builder()
                      .setAudioSource(MediaRecorder.AudioSource.MIC)
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(maxOf(min * 2, 16384))
                      .build()
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      throw IllegalStateException("mic init failed")
                  }
                  return rec
              }

              private fun buildCapture(): AudioRecord {
                  val pc = AudioPlaybackCaptureConfiguration.Builder(projection)
                      .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                      .addMatchingUsage(AudioAttributes.USAGE_GAME)
                      .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                      .build()
                  val fmt = AudioFormat.Builder()
                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                      .setSampleRate(SR)
                      .setChannelMask(AudioFormat.CHANNEL_IN_STEREO)
                      .build()
                  val min = AudioRecord.getMinBufferSize(SR, AudioFormat.CHANNEL_IN_STEREO, AudioFormat.ENCODING_PCM_16BIT)
                  val rec = AudioRecord.Builder()
                      .setAudioFormat(fmt)
                      .setBufferSizeInBytes(maxOf(min * 2, 16384))
                      .setAudioPlaybackCaptureConfig(pc)
                      .build()
                  if (rec.state != AudioRecord.STATE_INITIALIZED) {
                      rec.release()
                      throw IllegalStateException("capture init failed")
                  }
                  return rec
              }

              // ------------------------------------------------------------- muxer
              private fun addTrack(f: MediaFormat, video: Boolean) {
                  synchronized(muxLock) {
                      val m = muxer ?: return
                      if (muxerStarted) return
                      val i = m.addTrack(f)
                      if (video) vTrack = i else aTrack = i
                      tracksAdded++
                      if (tracksAdded >= tracksExpected) {
                          m.start()
                          muxerStarted = true
                      }
                  }
              }

              private fun waitMuxer(): Boolean {
                  var n = 0
                  while (!muxerStarted && n < 300 && !failed) {
                      Thread.sleep(10)
                      n++
                  }
                  if (!muxerStarted) {
                      // audio never arrived: start with video only
                      synchronized(muxLock) {
                          val m = muxer
                          if (!muxerStarted && m != null && vTrack >= 0) {
                              try {
                                  m.start()
                                  muxerStarted = true
                              } catch (e: Exception) {
                                  failed = true
                              }
                          }
                      }
                  }
                  return muxerStarted
              }

              // -------------------------------------------------------- video loop
              private fun videoLoop() {
                  val enc = vEnc ?: return
                  val info = MediaCodec.BufferInfo()
                  var base = -1L
                  var lastPts = -1L
                  try {
                      while (true) {
                          val idx = enc.dequeueOutputBuffer(info, 10000)
                          if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                              addTrack(enc.outputFormat, true)
                          } else if (idx >= 0) {
                              val buf = enc.getOutputBuffer(idx)
                              val eos = (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0
                              if ((info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0
                              if (info.size > 0 && buf != null && !paused) {
                                  if (base < 0) {
                                      val now = nowUs()
                                      base = if (Math.abs(info.presentationTimeUs - now) < 5000000L) startUs
                                      else info.presentationTimeUs - (now - startUs)
                                  }
                                  if (waitMuxer()) {
                                      var pts = info.presentationTimeUs - base - pausedTotalUs
                                      if (pts < 0) pts = 0
                                      if (pts <= lastPts) pts = lastPts + 1
                                      lastPts = pts
                                      buf.position(info.offset)
                                      buf.limit(info.offset + info.size)
                                      info.presentationTimeUs = pts
                                      synchronized(muxLock) {
                                          muxer?.writeSampleData(vTrack, buf, info)
                                      }
                                      wroteVideo = true
                                  }
                              }
                              enc.releaseOutputBuffer(idx, false)
                              if (eos) break
                          } else if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                              if (stopping && SystemClock.elapsedRealtime() - stopReqMs > 6000) break
                          }
                      }
                  } catch (e: Exception) {
                      failed = true
                  }
              }

              // -------------------------------------------------------- audio loop
              private fun clip(v: Int): Short {
                  return if (v > 32767) 32767.toShort() else if (v < -32768) (-32768).toShort() else v.toShort()
              }

              private fun drainAudio(enc: MediaCodec, info: MediaCodec.BufferInfo, timeoutUs: Long): Boolean {
                  while (true) {
                      val idx = enc.dequeueOutputBuffer(info, timeoutUs)
                      if (idx == MediaCodec.INFO_TRY_AGAIN_LATER) return false
                      if (idx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          addTrack(enc.outputFormat, false)
                          continue
                      }
                      if (idx >= 0) {
                          val buf = enc.getOutputBuffer(idx)
                          val eos = (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0
                          if ((info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) != 0) info.size = 0
                          if (info.size > 0 && buf != null) {
                              if (waitMuxer() && aTrack >= 0) {
                                  buf.position(info.offset)
                                  buf.limit(info.offset + info.size)
                                  synchronized(muxLock) {
                                      muxer?.writeSampleData(aTrack, buf, info)
                                  }
                              }
                          }
                          enc.releaseOutputBuffer(idx, false)
                          if (eos) return true
                      }
                  }
              }

              private fun audioLoop() {
                  val enc = aEnc ?: return
                  val info = MediaCodec.BufferInfo()
                  val frames = 1024
                  val micBuf = ShortArray(frames)
                  val capBuf = ShortArray(frames * 2)
                  val outBuf = ShortArray(frames * 2)
                  val m = micRec
                  val c = capRec
                  var samples = 0L
                  var basePts = 0L
                  var lastEnd = 0L
                  var needSync = true
                  try {
                      while (!stopping) {
                          var gotMic = 0
                          var gotCap = 0
                          if (m != null) {
                              val r = m.read(micBuf, 0, frames)
                              gotMic = if (r > 0) r else 0
                          }
                          if (c != null) {
                              val r = c.read(capBuf, 0, frames * 2)
                              gotCap = if (r > 0) r else 0
                          }
                          val n = if (m != null && c != null) minOf(gotMic, gotCap / 2)
                          else if (m != null) gotMic
                          else gotCap / 2
                          if (n <= 0) {
                              Thread.sleep(5)
                              drainAudio(enc, info, 0)
                              continue
                          }
                          if (paused) {
                              needSync = true
                              continue
                          }
                          for (i in 0 until n) {
                              val mv = if (m != null) micBuf[i].toInt() else 0
                              val l = mv + (if (c != null) capBuf[2 * i].toInt() else 0)
                              val r = mv + (if (c != null) capBuf[2 * i + 1].toInt() else 0)
                              outBuf[2 * i] = clip(l)
                              outBuf[2 * i + 1] = clip(r)
                          }
                          if (needSync) {
                              val chunkUs = n * 1000000L / SR
                              basePts = maxOf(nowUs() - startUs - pausedTotalUs - chunkUs, lastEnd)
                              samples = 0
                              needSync = false
                          }
                          val pts = basePts + samples * 1000000L / SR
                          samples += n
                          lastEnd = basePts + samples * 1000000L / SR

                          var queued = false
                          var tries = 0
                          while (!queued && tries < 50) {
                              val ii = enc.dequeueInputBuffer(10000)
                              if (ii >= 0) {
                                  val ib = enc.getInputBuffer(ii)
                                  if (ib != null) {
                                      ib.clear()
                                      ib.order(ByteOrder.nativeOrder())
                                      ib.asShortBuffer().put(outBuf, 0, n * 2)
                                      enc.queueInputBuffer(ii, 0, n * 4, pts, 0)
                                  }
                                  queued = true
                              }
                              drainAudio(enc, info, 0)
                              tries++
                          }
                      }
                      // end of stream
                      var tries = 0
                      while (tries < 100) {
                          val ii = enc.dequeueInputBuffer(10000)
                          if (ii >= 0) {
                              enc.queueInputBuffer(ii, 0, 0, lastEnd, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                              break
                          }
                          drainAudio(enc, info, 0)
                          tries++
                      }
                      var k = 0
                      while (k < 200) {
                          if (drainAudio(enc, info, 10000)) break
                          k++
                      }
                  } catch (e: Exception) {
                      failed = true
                  }
              }

              // ------------------------------------------------------ pause/resume
              fun pause() {
                  if (paused || stopping) return
                  pauseStartUs = nowUs()
                  paused = true
              }

              fun resume() {
                  if (!paused) return
                  pausedTotalUs += nowUs() - pauseStartUs
                  try {
                      val b = Bundle()
                      b.putInt(MediaCodec.PARAMETER_KEY_REQUEST_SYNC_FRAME, 0)
                      vEnc?.setParameters(b)
                  } catch (e: Exception) {
                  }
                  paused = false
              }

              // -------------------------------------------------------------- stop
              /** returns true when a valid file was written */
              fun stop(): Boolean {
                  if (stopping) return false
                  stopping = true
                  stopReqMs = SystemClock.elapsedRealtime()
                  try {
                      vDisplay?.release()
                  } catch (e: Exception) {
                  }
                  vDisplay = null
                  try {
                      vEnc?.signalEndOfInputStream()
                  } catch (e: Exception) {
                      failed = true
                  }
                  try {
                      aThread?.join(5000)
                      vThread?.join(7000)
                  } catch (e: Exception) {
                  }
                  val wrote = wroteVideo && muxerStarted
                  val closed = releaseAll()
                  return wrote && closed
              }

              private fun releaseAll(): Boolean {
                  var ok = true
                  try {
                      micRec?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      micRec?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      capRec?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      capRec?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      vDisplay?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      vEnc?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      vEnc?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      aEnc?.stop()
                  } catch (e: Exception) {
                  }
                  try {
                      aEnc?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      surface?.release()
                  } catch (e: Exception) {
                  }
                  try {
                      if (muxerStarted) muxer?.stop()
                  } catch (e: Exception) {
                      ok = false
                  }
                  try {
                      muxer?.release()
                  } catch (e: Exception) {
                  }
                  muxer = null
                  vEnc = null
                  aEnc = null
                  micRec = null
                  capRec = null
                  return ok
              }
          }
