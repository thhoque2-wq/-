                      Text(tr(bn, "💡 Tips", "💡 টিপস"), color = C.Text, fontWeight = FontWeight.Bold, fontSize = 14.sp)
                      Spacer(Modifier.height(4.dp))
                      Text(
                          tr(
                              bn,
                              "The app hides while recording - no recorder button on screen. Pause or stop from the notification bar. Saved to Movies/ScreenRecorder.",
                              "রেকর্ডিং চলার সময় অ্যাপ লুকিয়ে যায় - স্ক্রিনে কোনো রেকর্ডার বাটন থাকে না। নোটিফিকেশন বার থেকে বিরতি বা বন্ধ করুন। ভিডিও Movies/ScreenRecorder ফোল্ডারে সেভ হয়।"
