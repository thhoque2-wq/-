name: Build Screen Recorder Pro APK

# How to use: put this file at .github/workflows/build-screen-recorder.yml in a GitHub repo,
# push it, then open the Actions tab. The APK appears under Artifacts and under Releases.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate project files
        run: |
          mkdir -p ScreenRecorderPro ScreenRecorderPro/app ScreenRecorderPro/app/src/main ScreenRecorderPro/app/src/main/java/com/hiddeninfo/screenrecorder ScreenRecorderPro/app/src/main/res/drawable ScreenRecorderPro/app/src/main/res/mipmap-anydpi-v26 ScreenRecorderPro/app/src/main/res/values
          cat > ScreenRecorderPro/app/build.gradle.kts <<'KTEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.hiddeninfo.screenrecorder"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.hiddeninfo.screenrecorder"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          KTEOF
          cat > ScreenRecorderPro/app/src/main/AndroidManifest.xml <<'KTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RecorderService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
              </application>
          </manifest>
          KTEOF
          cat > ScreenRecorderPro/app/src/main/java/com/hiddeninfo/screenrecorder/MainActivity.kt <<'KTEOF'
          package com.hiddeninfo.screenrecorder

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          class MainActivity : ComponentActivity() {

              private var settings by mutableStateOf(RecSettings())
              private var hideWhenStarted = false

              private val projLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val d = r.data
                  if (r.resultCode == RESULT_OK && d != null) {
                      launchService(r.resultCode, d)
                  } else {
                      Toast.makeText(
                          this,
                          tr(settings.bengali, "Screen capture permission denied", "স্ক্রিন ক্যাপচার পারমিশন দেওয়া হয়নি"),
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              private val permLauncher = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { _ ->
                  requestProjection()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  settings = Prefs.load(this)
                  setContent {
                      AppTheme {
                          LaunchedEffect(RecState.recording) {
                              if (RecState.recording && hideWhenStarted) {
                                  hideWhenStarted = false
                                  moveTaskToBack(true)
                              }
                          }
                          Root(
                              s = settings,
                              onSettings = { settings = it; Prefs.save(this@MainActivity, it) },
                              onRecord = { startFlow() },
                              onPauseResume = {
                                  sendAction(if (RecState.paused) RecorderService.ACTION_RESUME else RecorderService.ACTION_PAUSE)
                              },
                              onStop = { sendAction(RecorderService.ACTION_STOP) },
                              onCancel = { sendAction(RecorderService.ACTION_STOP) }
                          )
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  RecState.libraryVersion = RecState.libraryVersion + 1
              }

              private fun startFlow() {
                  if (RecState.recording || RecState.countdown > 0) return
                  val need = ArrayList<String>()
                  if (settings.audio != 0 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) permLauncher.launch(need.toTypedArray()) else requestProjection()
              }

              private fun requestProjection() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projLauncher.launch(mpm.createScreenCaptureIntent())
              }

              private fun launchService(code: Int, data: Intent) {
                  val i = Intent(this, RecorderService::class.java)
                  i.action = RecorderService.ACTION_START
                  i.putExtra(RecorderService.EXTRA_CODE, code)
                  i.putExtra(RecorderService.EXTRA_DATA, data)
                  hideWhenStarted = true
                  startForegroundService(i)
              }

              private fun sendAction(action: String) {
                  try {
                      val i = Intent(this, RecorderService::class.java)
                      i.action = action
                      startService(i)
                  } catch (e: Exception) {
                  }
              }
          }
          KTEOF
          cat > ScreenRecorderPro/app/src/main/java/com/hiddeninfo/screenrecorder/Prefs.kt <<'KTEOF'
          package com.hiddeninfo.screenrecorder

          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          data class RecSettings(
              val resolution: Int = 1080,   // short side in px, 0 = native
              val fps: Int = 30,
              val bitrateMbps: Int = 0,     // 0 = auto
              val audio: Int = 1,           // 0 none, 1 mic, 2 internal, 3 both
              val orientation: Int = 0,     // 0 auto, 1 portrait, 2 landscape
              val countdown: Int = 3,
              val shakeToStop: Boolean = false,
              val vibrate: Boolean = true,
              val bengali: Boolean = true
          )

          object RecState {
              var recording by mutableStateOf(false)
              var paused by mutableStateOf(false)
              var countdown by mutableIntStateOf(-1)
              var elapsedMs by mutableLongStateOf(0L)
              var libraryVersion by mutableIntStateOf(0)
          }

          object Prefs {
              private fun sp(c: Context) = c.getSharedPreferences("srp_settings", Context.MODE_PRIVATE)

              fun load(c: Context): RecSettings {
                  val p = sp(c)
                  val d = RecSettings()
                  return RecSettings(
                      resolution = p.getInt("res", d.resolution),
                      fps = p.getInt("fps", d.fps),
                      bitrateMbps = p.getInt("br", d.bitrateMbps),
                      audio = p.getInt("audio", d.audio),
                      orientation = p.getInt("ori", d.orientation),
                      countdown = p.getInt("cd", d.countdown),
                      shakeToStop = p.getBoolean("shake", d.shakeToStop),
                      vibrate = p.getBoolean("vib", d.vibrate),
                      bengali = p.getBoolean("bn", d.bengali)
                  )
              }

              fun save(c: Context, s: RecSettings) {
                  sp(c).edit()
                      .putInt("res", s.resolution)
                      .putInt("fps", s.fps)
                      .putInt("br", s.bitrateMbps)
                      .putInt("audio", s.audio)
                      .putInt("ori", s.orientation)
                      .putInt("cd", s.countdown)
                      .putBoolean("shake", s.shakeToStop)
                      .putBoolean("vib", s.vibrate)
                      .putBoolean("bn", s.bengali)
                      .apply()
              }
          }
          KTEOF
          cat > ScreenRecorderPro/app/src/main/java/com/hiddeninfo/screenrecorder/RecorderService.kt <<'KTEOF'
          package com.hiddeninfo.screenrecorder

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.hardware.display.DisplayManager
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.util.DisplayMetrics
          import android.view.Display
          import android.widget.Toast
          import androidx.core.content.IntentCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          class RecorderService : Service(), SensorEventListener {

              companion object {
                  const val ACTION_START = "com.hiddeninfo.screenrecorder.START"
                  const val ACTION_STOP = "com.hiddeninfo.screenrecorder.STOP"
                  const val ACTION_PAUSE = "com.hiddeninfo.screenrecorder.PAUSE"
                  const val ACTION_RESUME = "com.hiddeninfo.screenrecorder.RESUME"
                  const val EXTRA_CODE = "code"
                  const val EXTRA_DATA = "data"
                  const val CH_REC = "rec_channel"
                  const val CH_DONE = "rec_done"
                  const val NOTIF_ID = 101
                  const val DONE_ID = 102
              }

              private var settings = RecSettings()
              private var projection: MediaProjection? = null
              private var recorder: ScreenRecorder? = null
              private var pendingCode = 0
              private var pendingData: Intent? = null
              private var outUri: Uri? = null
              private var pfd: ParcelFileDescriptor? = null
              private var sm: SensorManager? = null

              private val handler = Handler(Looper.getMainLooper())
              private var segmentStart = 0L
              private var accumulated = 0L
              private var cdLeft = 0
              private var shakeCount = 0
              private var lastShake = 0L

              private fun t(en: String, bn: String): String = if (settings.bengali) bn else en

              private val ticker = object : Runnable {
                  override fun run() {
                      if (RecState.recording && !RecState.paused) {
                          RecState.elapsedMs = currentElapsed()
                      }
                      handler.postDelayed(this, 500)
                  }
              }

              private val countdownTick = object : Runnable {
                  override fun run() {
                      cdLeft -= 1
                      if (cdLeft <= 0) {
                          RecState.countdown = -1
                          beginCapture()
                      } else {
                          RecState.countdown = cdLeft
                          vibrate(25)
                          updateNotification()
                          handler.postDelayed(this, 1000)
                      }
                  }
              }

              private fun currentElapsed(): Long {
                  return if (RecState.paused) accumulated
                  else accumulated + (SystemClock.elapsedRealtime() - segmentStart)
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> startRecording(intent)
                      ACTION_STOP -> {
                          if (RecState.countdown > 0) cancelCountdown()
                          else if (RecState.recording) stopRecording()
                          else stopSelf()
                      }
                      ACTION_PAUSE -> pauseRecording()
                      ACTION_RESUME -> resumeRecording()
                      else -> if (!RecState.recording && RecState.countdown <= 0) stopSelf()
                  }
                  return START_NOT_STICKY
              }

              // ------------------------------------------------------------ start
              private fun startRecording(intent: Intent) {
                  if (RecState.recording || RecState.countdown > 0) return
                  settings = Prefs.load(this)
                  createChannels()
                  pendingCode = intent.getIntExtra(EXTRA_CODE, 0)
                  pendingData = IntentCompat.getParcelableExtra(intent, EXTRA_DATA, Intent::class.java)

                  val micOk = checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  val useAudio = settings.audio != 0 && micOk
                  var type = ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                  if (useAudio && Build.VERSION.SDK_INT >= 30) {
                      type = type or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  }
                  if (settings.countdown > 0) {
                      cdLeft = settings.countdown
                      RecState.countdown = cdLeft
                  }
                  try {
                      startForeground(NOTIF_ID, buildNotification(), type)
                  } catch (e: Exception) {
                      Toast.makeText(this, t("Cannot start recorder: ", "রেকর্ডার চালু করা যায়নি: ") + e.message, Toast.LENGTH_LONG).show()
                      RecState.countdown = -1
                      stopSelf()
                      return
                  }
                  if (settings.audio != 0 && !micOk) {
                      Toast.makeText(
                          this,
                          t("Mic permission denied - recording without sound", "মাইক পারমিশন নেই - সাউন্ড ছাড়া রেকর্ড হবে"),
                          Toast.LENGTH_LONG
                      ).show()
                  }
                  if (settings.countdown > 0) {
                      handler.postDelayed(countdownTick, 1000)
                  } else {
                      beginCapture()
                  }
              }

              private fun cancelCountdown() {
                  handler.removeCallbacks(countdownTick)
                  RecState.countdown = -1
                  pendingData = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun beginCapture() {
                  val data = pendingData
                  if (data == null) {
                      fail(t("Permission data missing", "পারমিশন ডেটা পাওয়া যায়নি"))
                      return
                  }
                  try {
                      val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      val p = mpm.getMediaProjection(pendingCode, data)
                      projection = p
                      p.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() {
                              handler.post { if (RecState.recording) stopRecording() }
                          }
                      }, handler)
                  } catch (e: Exception) {
                      fail(t("Screen capture failed: ", "স্ক্রিন ক্যাপচার ব্যর্থ: ") + e.message)
                      return
                  }
                  pendingData = null

                  try {
                      val name = "Rec_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".mp4"
                      val values = ContentValues()
                      values.put(MediaStore.Video.Media.DISPLAY_NAME, name)
                      values.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      values.put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/ScreenRecorder")
                      values.put(MediaStore.Video.Media.IS_PENDING, 1)
                      val uri = contentResolver.insert(MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY), values)
                      if (uri == null) {
                          fail(t("Cannot create file", "ফাইল তৈরি করা যায়নি"))
                          return
                      }
                      outUri = uri
                      pfd = contentResolver.openFileDescriptor(uri, "rw")
                  } catch (e: Exception) {
                      fail(t("Storage error: ", "স্টোরেজ সমস্যা: ") + e.message)
                      return
                  }

                  val attempts = buildAttempts()
                  var started: ScreenRecorder? = null
                  var lastErr: Exception? = null
                  for (cfg in attempts) {
                      val r = ScreenRecorder(projection!!, cfg, pfd!!.fileDescriptor)
                      try {
                          r.start()
                          started = r
                          break
                      } catch (e: Exception) {
                          lastErr = e
                      }
                  }
                  if (started == null) {
                      fail(t("Encoder failed: ", "এনকোডার ব্যর্থ: ") + (lastErr?.message ?: ""))
                      return
                  }
                  recorder = started
                  if (settings.audio != 0) {
                      val wantMic = settings.audio == 1 || settings.audio == 3
                      val wantInt = settings.audio == 2 || settings.audio == 3
                      if (wantInt && !started.internalActive) {
                          Toast.makeText(this, t("Internal audio not available on this device", "এই ফোনে ইন্টারনাল অডিও পাওয়া যায়নি"), Toast.LENGTH_LONG).show()
                      } else if (wantMic && !started.micActive && settings.audio == 1) {
                          Toast.makeText(this, t("Microphone not available", "মাইক পাওয়া যায়নি"), Toast.LENGTH_LONG).show()
                      }
                  }

                  accumulated = 0L
                  segmentStart = SystemClock.elapsedRealtime()
                  RecState.elapsedMs = 0L
                  RecState.paused = false
                  RecState.recording = true
                  handler.removeCallbacks(ticker)
                  handler.post(ticker)
                  if (settings.shakeToStop) registerShake()
                  vibrate(80)
                  updateNotification()
              }

              @Suppress("DEPRECATION")
              private fun buildAttempts(): List<RecConfig> {
                  val dm = DisplayMetrics()
                  val dmgr = getSystemService(DISPLAY_SERVICE) as DisplayManager
                  dmgr.getDisplay(Display.DEFAULT_DISPLAY).getRealMetrics(dm)
                  val w = dm.widthPixels
                  val h = dm.heightPixels
                  val shortSide = min(w, h)
                  val longSide = max(w, h)
                  val pw: Int
                  val ph: Int
                  when (settings.orientation) {
                      1 -> { pw = shortSide; ph = longSide }
                      2 -> { pw = longSide; ph = shortSide }
                      else -> { pw = w; ph = h }
                  }
                  val wantMic = settings.audio == 1 || settings.audio == 3
                  val wantInt = settings.audio == 2 || settings.audio == 3
                  val micOk = checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  val mic = wantMic && micOk
                  val internal = wantInt && micOk

                  fun align(v: Float): Int = max(16, (v / 16f).roundToInt() * 16)
                  fun make(targetShort: Int, fps: Int, bitrate: Int): RecConfig {
                      val target = if (targetShort <= 0) shortSide else min(targetShort, shortSide)
                      val scale = target.toFloat() / shortSide.toFloat()
                      val ow = align(pw * scale)
                      val oh = align(ph * scale)
                      val br = if (bitrate > 0) bitrate
                      else (ow.toLong() * oh * fps * 0.09).toInt().coerceIn(3000000, 40000000)
                      return RecConfig(ow, oh, dm.densityDpi, fps, br, mic, internal)
                  }

                  val fps = settings.fps
                  val userBr = settings.bitrateMbps * 1000000
                  val list = ArrayList<RecConfig>()
                  list.add(make(settings.resolution, fps, userBr))
                  list.add(make(min(if (settings.resolution == 0) 1080 else settings.resolution, 1080), min(fps, 30), 0))
                  list.add(make(720, 30, 0))
                  return list
              }

              // ------------------------------------------------------------- pause
              private fun pauseRecording() {
                  if (!RecState.recording || RecState.paused) return
                  recorder?.pause()
                  accumulated += SystemClock.elapsedRealtime() - segmentStart
                  RecState.elapsedMs = accumulated
                  RecState.paused = true
                  updateNotification()
              }

              private fun resumeRecording() {
                  if (!RecState.recording || !RecState.paused) return
                  recorder?.resume()
                  segmentStart = SystemClock.elapsedRealtime()
                  RecState.paused = false
                  updateNotification()
              }

              // -------------------------------------------------------------- stop
              private fun stopRecording() {
                  if (!RecState.recording) return
                  handler.removeCallbacks(ticker)
                  RecState.recording = false
                  RecState.paused = false
                  val rec = recorder
                  recorder = null
                  vibrate(80)
                  Thread {
                      val ok = try {
                          rec?.stop() ?: false
                      } catch (e: Exception) {
                          false
                      }
                      handler.post { finalizeOutput(ok) }
                  }.start()
              }

              private fun fail(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
                  RecState.countdown = -1
                  RecState.recording = false
                  finalizeOutput(false, silent = true)
              }

              private fun finalizeOutput(ok: Boolean, silent: Boolean = false) {
                  try {
                      pfd?.close()
                  } catch (e: Exception) {
                  }
                  pfd = null
                  val uri = outUri
                  outUri = null
                  if (uri != null) {
                      if (ok) {
                          try {
                              val v = ContentValues()
                              v.put(MediaStore.Video.Media.IS_PENDING, 0)
                              contentResolver.update(uri, v, null, null)
                          } catch (e: Exception) {
                          }
                      } else {
                          try {
                              contentResolver.delete(uri, null, null)
                          } catch (e: Exception) {
                          }
                      }
                  }
                  try {
                      projection?.stop()
                  } catch (e: Exception) {
                  }
                  projection = null
                  try {
                      sm?.unregisterListener(this)
                  } catch (e: Exception) {
                  }
                  sm = null
                  handler.removeCallbacks(ticker)
                  RecState.recording = false
                  RecState.paused = false
                  RecState.countdown = -1
                  try {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } catch (e: Exception) {
                  }
                  if (ok && uri != null) {
                      RecState.libraryVersion = RecState.libraryVersion + 1
                      showDone(uri)
                  } else if (!silent) {
                      Toast.makeText(this, t("Recording failed or empty", "রেকর্ডিং ব্যর্থ হয়েছে"), Toast.LENGTH_LONG).show()
                  }
                  stopSelf()
              }

              // ----------------------------------------------------- notifications
              private fun createChannels() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  val c1 = NotificationChannel(CH_REC, "Recording", NotificationManager.IMPORTANCE_LOW)
                  c1.setShowBadge(false)
                  nm.createNotificationChannel(c1)
                  val c2 = NotificationChannel(CH_DONE, "Saved recordings", NotificationManager.IMPORTANCE_DEFAULT)
                  nm.createNotificationChannel(c2)
              }

              private fun servicePi(action: String, rc: Int): PendingIntent {
                  val i = Intent(this, RecorderService::class.java)
                  i.action = action
                  return PendingIntent.getService(this, rc, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              private fun buildNotification(): Notification {
                  val cd = RecState.countdown
                  val paused = RecState.paused
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val title = when {
                      cd > 0 -> t("Starting in ${cd}...", "${cd} সেকেন্ডে শুরু হবে...")
                      paused -> t("Recording paused", "রেকর্ডিং বিরতিতে আছে")
                      else -> t("Recording screen", "স্ক্রিন রেকর্ড হচ্ছে")
                  }
                  val text = if (cd > 0) t("Tap Cancel to abort", "বাতিল করতে Cancel চাপুন")
                  else t("Use the buttons below to control", "নিচের বাটন দিয়ে নিয়ন্ত্রণ করুন")
                  val icon = Icon.createWithResource(this, R.drawable.ic_stat)
                  val b = Notification.Builder(this, CH_REC)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setShowWhen(true)
                      .setWhen(System.currentTimeMillis() - (if (RecState.recording) currentElapsed() else 0L))
                      .setUsesChronometer(RecState.recording && !paused && cd <= 0)
                  if (cd > 0) {
                      b.addAction(Notification.Action.Builder(icon, t("Cancel", "বাতিল"), servicePi(ACTION_STOP, 3)).build())
                  } else {
                      if (paused) {
                          b.addAction(Notification.Action.Builder(icon, t("Resume", "চালু করুন"), servicePi(ACTION_RESUME, 2)).build())
                      } else {
                          b.addAction(Notification.Action.Builder(icon, t("Pause", "বিরতি"), servicePi(ACTION_PAUSE, 2)).build())
                      }
                      b.addAction(Notification.Action.Builder(icon, t("Stop", "বন্ধ করুন"), servicePi(ACTION_STOP, 3)).build())
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      b.setForegroundServiceBehavior(Notification.FOREGROUND_SERVICE_IMMEDIATE)
                  }
                  return b.build()
              }

              private fun updateNotification() {
                  try {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotification())
                  } catch (e: Exception) {
                  }
              }

              private fun showDone(uri: Uri) {
                  try {
                      val view = Intent(Intent.ACTION_VIEW)
                      view.setDataAndType(uri, "video/mp4")
                      view.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                      val pi = PendingIntent.getActivity(this, 5, view, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                      val n = Notification.Builder(this, CH_DONE)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(t("Recording saved", "রেকর্ডিং সেভ হয়েছে"))
                          .setContentText(t("Tap to play - Movies/ScreenRecorder", "দেখতে ট্যাপ করুন - Movies/ScreenRecorder"))
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build()
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(DONE_ID, n)
                  } catch (e: Exception) {
                  }
              }

              @Suppress("DEPRECATION")
              private fun vibrate(ms: Long) {
                  if (!settings.vibrate) return
                  try {
                      val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                      v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  } catch (e: Exception) {
                  }
              }

              // ------------------------------------------------------- shake to stop
              private fun registerShake() {
                  try {
                      val m = getSystemService(SENSOR_SERVICE) as SensorManager
                      sm = m
                      m.registerListener(this, m.getDefaultSensor(Sensor.TYPE_ACCELEROMETER), SensorManager.SENSOR_DELAY_UI)
                  } catch (e: Exception) {
                  }
              }

              override fun onSensorChanged(e: SensorEvent) {
                  val x = e.values[0]
                  val y = e.values[1]
                  val z = e.values[2]
                  val g = sqrt(x * x + y * y + z * z) / SensorManager.GRAVITY_EARTH
                  if (g > 2.8f) {
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastShake < 350) return
                      if (now - lastShake > 2000) shakeCount = 0
                      lastShake = now
                      shakeCount++
                      if (shakeCount >= 3) {
                          shakeCount = 0
                          handler.post { if (RecState.recording) stopRecording() }
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  try {
                      sm?.unregisterListener(this)
                  } catch (e: Exception) {
                  }
                  super.onDestroy()
              }
          }
