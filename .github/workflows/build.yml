              val Muted = Color(0xFF8D98B5)
              val Line = Color(0xFF2A3558)
          }

          fun tr(bn: Boolean, en: String, b: String): String = if (bn) b else en

          fun fmtTime(ms: Long): String {
              val s = ms / 1000
              val h = s / 3600
              val m = (s % 3600) / 60
              val sec = s % 60
              return if (h > 0) String.format(Locale.US, "%d:%02d:%02d", h, m, sec)
              else String.format(Locale.US, "%02d:%02d", m, sec)
          }

          fun audioLabel(bn: Boolean, m: Int): String = when (m) {
              0 -> tr(bn, "No sound", "সাউন্ড ছাড়া")
              1 -> tr(bn, "Mic", "মাইক")
              2 -> tr(bn, "Internal", "ইন্টারনাল")
              else -> tr(bn, "Mic + Internal", "মাইক + ইন্টারনাল")
          }

