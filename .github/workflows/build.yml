      - name: Build release APK
        run: gradle -p ScreenRecorderPro :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp ScreenRecorderPro/app/build/outputs/apk/release/*.apk out/ScreenRecorderPro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRecorderPro-APK
          path: out/ScreenRecorderPro.apk

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Screen Recorder Pro build ${{ github.run_number }}
          files: out/ScreenRecorderPro.apk
