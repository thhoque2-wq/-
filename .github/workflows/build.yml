          // ================================================================== root
          @Composable
          fun Root(
              s: RecSettings,
              onSettings: (RecSettings) -> Unit,
              onRecord: () -> Unit,
              onPauseResume: () -> Unit,
              onStop: () -> Unit,
              onCancel: () -> Unit
          ) {
              var tab by remember { mutableIntStateOf(0) }
              val bn = s.bengali
              val tabs = listOf(
                  "🎥" to tr(bn, "Record", "রেকর্ড"),
                  "📁" to tr(bn, "Library", "লাইব্রেরি"),
                  "⚙️" to tr(bn, "Settings", "সেটিংস")
              )
              Box(Modifier.fillMaxSize().background(C.Bg)) {
                  Scaffold(
                      containerColor = C.Bg,
                      bottomBar = {
                          NavigationBar(containerColor = C.Surface) {
                              tabs.forEachIndexed { i, (ic, label) ->
                                  NavigationBarItem(
                                      selected = tab == i,
                                      onClick = { tab = i },
                                      icon = { Text(ic, fontSize = 20.sp) },
                                      label = { Text(label, fontSize = 12.sp) },
                                      colors = NavigationBarItemDefaults.colors(
                                          indicatorColor = C.Line,
                                          selectedTextColor = C.Accent,
                                          unselectedTextColor = C.Muted
                                      )
                                  )
                              }
                          }
                      }
                  ) { pad ->
                      Box(Modifier.padding(pad).fillMaxSize()) {
                          when (tab) {
                              0 -> HomeScreen(s, onRecord, onPauseResume, onStop)
                              1 -> LibraryScreen(bn)
                              else -> SettingsScreen(s, onSettings)
                          }
                      }
                  }
                  if (RecState.countdown > 0) CountdownOverlay(RecState.countdown, bn, onCancel)
              }
          }

