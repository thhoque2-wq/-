          // ============================================================== library
          data class VideoItem(val uri: Uri, val name: String, val durMs: Long, val size: Long, val dateSec: Long)

          fun loadVideos(ctx: Context): List<VideoItem> {
              val out = ArrayList<VideoItem>()
              val proj = arrayOf(
                  MediaStore.Video.Media._ID,
                  MediaStore.Video.Media.DISPLAY_NAME,
                  MediaStore.Video.Media.DURATION,
                  MediaStore.Video.Media.SIZE,
                  MediaStore.Video.Media.DATE_ADDED
              )
              try {
                  ctx.contentResolver.query(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      proj,
                      MediaStore.Video.Media.RELATIVE_PATH + " LIKE ?",
                      arrayOf("%ScreenRecorder%"),
                      MediaStore.Video.Media.DATE_ADDED + " DESC"
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val id = c.getLong(0)
                          out.add(
                              VideoItem(
                                  ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id),
                                  c.getString(1) ?: "video.mp4",
                                  c.getLong(2), c.getLong(3), c.getLong(4)
                              )
                          )
                      }
                  }
              } catch (e: Exception) {
              }
              return out
          }

          fun playVideo(ctx: Context, uri: Uri) {
              try {
                  val i = Intent(Intent.ACTION_VIEW)
                  i.setDataAndType(uri, "video/mp4")
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ctx.startActivity(i)
              } catch (e: Exception) {
                  Toast.makeText(ctx, "No video player found", Toast.LENGTH_SHORT).show()
              }
          }

          fun shareVideo(ctx: Context, uri: Uri) {
              try {
                  val i = Intent(Intent.ACTION_SEND)
                  i.type = "video/mp4"
                  i.putExtra(Intent.EXTRA_STREAM, uri)
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ctx.startActivity(Intent.createChooser(i, "Share"))
              } catch (e: Exception) {
                  Toast.makeText(ctx, "Cannot share", Toast.LENGTH_SHORT).show()
              }
          }

          @Composable
          fun Thumb(uri: Uri, modifier: Modifier) {
              val ctx = LocalContext.current
              val bmp by produceState<Bitmap?>(initialValue = null, uri) {
                  value = withContext(Dispatchers.IO) {
                      try {
                          ctx.contentResolver.loadThumbnail(uri, Size(360, 200), null)
                      } catch (e: Exception) {
                          null
                      }
                  }
              }
              val b = bmp
              if (b != null) {
                  Image(bitmap = b.asImageBitmap(), contentDescription = null, modifier = modifier, contentScale = ContentScale.Crop)
              } else {
                  Box(modifier.background(C.Line), contentAlignment = Alignment.Center) { Text("🎬", fontSize = 22.sp) }
              }
          }

          @Composable
          fun VideoCard(v: VideoItem, bn: Boolean, onDelete: () -> Unit) {
              val ctx = LocalContext.current
              val date = SimpleDateFormat("dd MMM yyyy, hh:mm a", Locale.getDefault()).format(Date(v.dateSec * 1000L))
              val mb = String.format(Locale.US, "%.1f MB", v.size / 1048576.0)
              Column(
                  Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(18.dp))
                      .background(C.Card)
                      .padding(12.dp)
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Thumb(v.uri, Modifier.size(width = 120.dp, height = 70.dp).clip(RoundedCornerShape(12.dp)))
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Text(v.name, color = C.Text, fontSize = 14.sp, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          Spacer(Modifier.height(2.dp))
                          Text(fmtTime(v.durMs) + "  •  " + mb, color = C.Muted, fontSize = 12.sp)
                          Text(date, color = C.Muted, fontSize = 12.sp)
                      }
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                      TextButton(onClick = { playVideo(ctx, v.uri) }) {
                          Text("▶ " + tr(bn, "Play", "চালান"), color = C.Accent)
                      }
                      TextButton(onClick = { shareVideo(ctx, v.uri) }) {
                          Text("↗ " + tr(bn, "Share", "শেয়ার"), color = C.Accent2)
                      }
                      TextButton(onClick = onDelete) {
                          Text("🗑 " + tr(bn, "Delete", "ডিলিট"), color = C.Muted)
                      }
                  }
              }
          }

          @Composable
          fun LibraryScreen(bn: Boolean) {
              val ctx = LocalContext.current
              var videos by remember { mutableStateOf(listOf<VideoItem>()) }
              var toDelete by remember { mutableStateOf<VideoItem?>(null) }
              var tick by remember { mutableIntStateOf(0) }

              LaunchedEffect(tick, RecState.libraryVersion) {
                  videos = withContext(Dispatchers.IO) { loadVideos(ctx) }
              }

              Column(Modifier.fillMaxSize().background(C.Bg).padding(16.dp)) {
                  Text(tr(bn, "My Recordings", "আমার রেকর্ডিং"), color = C.Text, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(12.dp))
                  if (videos.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text(
                              tr(bn, "No recordings yet", "এখনো কোনো রেকর্ডিং নেই"),
                              color = C.Muted, fontSize = 15.sp
                          )
                      }
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          items(videos, key = { it.uri.toString() }) { v ->
                              VideoCard(v, bn) { toDelete = v }
                          }
                      }
                  }
              }

              val d = toDelete
              if (d != null) {
                  AlertDialog(
                      onDismissRequest = { toDelete = null },
                      containerColor = C.Card,
                      title = { Text(tr(bn, "Delete recording?", "রেকর্ডিং ডিলিট করবেন?"), color = C.Text) },
                      text = { Text(d.name, color = C.Muted) },
                      confirmButton = {
                          TextButton(onClick = {
                              try {
                                  ctx.contentResolver.delete(d.uri, null, null)
                              } catch (e: Exception) {
                                  Toast.makeText(ctx, "Cannot delete", Toast.LENGTH_SHORT).show()
                              }
                              toDelete = null
                              tick += 1
                          }) { Text(tr(bn, "Delete", "ডিলিট"), color = C.Accent) }
                      },
                      dismissButton = {
