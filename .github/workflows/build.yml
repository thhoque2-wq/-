          // ================================================================== home
          @Composable
          fun HomeScreen(s: RecSettings, onRecord: () -> Unit, onPauseResume: () -> Unit, onStop: () -> Unit) {
              val bn = s.bengali
              val rec = RecState.recording
              val paused = RecState.paused
              val inf = rememberInfiniteTransition(label = "pulse")
              val pulse by inf.animateFloat(
                  initialValue = 1f,
                  targetValue = 1.2f,
                  animationSpec = infiniteRepeatable(tween(900, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "p"
              )
              val resLabel = if (s.resolution == 0) tr(bn, "Native", "অরিজিনাল") else "${s.resolution}p"
              val summary = resLabel + "  •  " + s.fps + " fps  •  " + audioLabel(bn, s.audio)

              Column(
                  Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(C.Bg, Color(0xFF121A34))))
                      .padding(20.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Spacer(Modifier.height(6.dp))
                  Text("Screen Recorder Pro", color = C.Text, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Text(
                      tr(bn, "Full HD  •  Mic  •  Internal audio", "ফুল HD  •  মাইক  •  ইন্টারনাল অডিও"),
                      color = C.Muted, fontSize = 13.sp
                  )
                  Spacer(Modifier.weight(1f))

                  Box(contentAlignment = Alignment.Center, modifier = Modifier.size(240.dp)) {
                      if (rec && !paused) {
                          Box(
                              Modifier
                                  .size(200.dp)
                                  .graphicsLayer { scaleX = pulse; scaleY = pulse; alpha = 0.22f }
                                  .background(C.Accent, CircleShape)
                          )
                      }
                      Box(
                          Modifier
                              .size(180.dp)
                              .clip(CircleShape)
                              .background(
                                  Brush.radialGradient(
                                      listOf(if (paused) Color(0xFFB9A3FF) else Color(0xFFFF7A93), if (paused) C.Accent2 else C.Accent)
                                  )
                              )
                              .clickable { if (rec) onStop() else onRecord() },
                          contentAlignment = Alignment.Center
                      ) {
                          if (rec) {
                              Box(Modifier.size(58.dp).background(Color.White, RoundedCornerShape(14.dp)))
                          } else {
                              Box(Modifier.size(78.dp).border(5.dp, Color.White, CircleShape), contentAlignment = Alignment.Center) {
                                  Box(Modifier.size(34.dp).background(Color.White, CircleShape))
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(18.dp))
                  if (rec) {
                      Text(fmtTime(RecState.elapsedMs), color = C.Text, fontSize = 46.sp, fontWeight = FontWeight.Bold)
                      Text(
                          if (paused) tr(bn, "Paused", "বিরতিতে আছে")
                          else tr(bn, "Recording... stop from the notification bar", "রেকর্ডিং চলছে... নোটিফিকেশন বার থেকে বন্ধ করুন"),
                          color = if (paused) C.Accent2 else C.Accent, fontSize = 14.sp, textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(16.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          PillButton(
                              if (paused) tr(bn, "▶ Resume", "▶ চালু করুন") else tr(bn, "⏸ Pause", "⏸ বিরতি"),
                              C.Accent2, onPauseResume
                          )
                          PillButton(tr(bn, "⏹ Stop", "⏹ বন্ধ"), C.Accent, onStop)
                      }
                  } else {
                      Text(tr(bn, "Tap to start recording", "রেকর্ড শুরু করতে ট্যাপ করুন"), color = C.Text, fontSize = 18.sp, fontWeight = FontWeight.Medium)
                      Spacer(Modifier.height(6.dp))
